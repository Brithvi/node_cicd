name: Deploy ECS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::454659161933:role/nodeapp_cicd_githubactions
        aws-region: ap-southeast-1

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build image
      run: docker build -t ecs-devops-app .

    - name: Push image
      run: |
        docker tag ecs-devops-app:latest \
        454659161933.dkr.ecr.ap-southeast-1.amazonaws.com/ecs-devops-app:latest
        
        docker push \
        454659161933.dkr.ecr.ap-southeast-1.amazonaws.com/ecs-devops-app:latest

    - name: Deploy ECS
      run: |
        aws ecs update-service \
        --cluster ecs-devops-cluster \
        --service ecs-devops-app \
        --force-new-deployment